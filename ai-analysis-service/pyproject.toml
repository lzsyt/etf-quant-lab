[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-ai-analysis"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "beautifulsoup4>=4.12,<5", "defusedxml>=0.7,<1", "pypdf==6.21.4"]

[tool.setuptools.packages.find]
where = ["src"]
