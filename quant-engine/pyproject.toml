[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "etf-quant-engine"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.10,<3",
  "pandas>=2.2,<3", "numpy>=2,<3", "scikit-learn>=1.6,<2",
  "lightgbm>=4.5,<5", "xgboost-cpu>=3,<4", "httpx>=0.28,<1",
  "akshare==1.19.3", "joblib>=1.4,<2", "tzdata>=2025.1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
