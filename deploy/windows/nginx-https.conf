daemon off;
worker_processes 1;
error_log C:/ETFQuantLab/logs/nginx/error.log warn;
pid C:/ETFQuantLab/logs/nginx/nginx.pid;
events { worker_connections 512; }
http {
    include C:/ETFQuantLab/runtime/nginx/conf/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    charset utf-8;
    log_format minimal '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log C:/ETFQuantLab/logs/nginx/access.log minimal;
    client_max_body_size 10m;
    client_body_temp_path C:/ETFQuantLab/data/nginx/client_temp;
    proxy_temp_path C:/ETFQuantLab/data/nginx/proxy_temp;
    limit_req_zone $binary_remote_addr zone=login:1m rate=2r/m;
    limit_req_status 429;
    server {
        listen 80 default_server;
        server_name @DOMAIN@;
        if ($host != @DOMAIN@) { return 404; }
        location ^~ /.well-known/acme-challenge/ {
            root C:/ETFQuantLab/data/acme-webroot;
            default_type text/plain;
            try_files $uri =404;
        }
        location / { return 308 https://@DOMAIN@$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name @DOMAIN@;
        if ($host != @DOMAIN@) { return 404; }
        ssl_certificate C:/ETFQuantLab/config/tls/etf-chain.pem;
        ssl_certificate_key C:/ETFQuantLab/config/tls/etf-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:2m;
        ssl_session_timeout 1h;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        # 内部健康检查仍可在本机执行，公网不开放管理端点。
        location /actuator { return 404; }
        location = /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            proxy_pass http://127.0.0.1:18080;
        }
        location / { proxy_pass http://127.0.0.1:18080; }
    }
}
