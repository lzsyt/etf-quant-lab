daemon off;
worker_processes 1;
error_log C:/ETFQuantLab/logs/nginx/error.log warn;
pid C:/ETFQuantLab/logs/nginx/nginx.pid;
events { worker_connections 512; }
http {
    include C:/ETFQuantLab/runtime/nginx/conf/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_body_temp_path C:/ETFQuantLab/data/nginx/client_temp;
    proxy_temp_path C:/ETFQuantLab/data/nginx/proxy_temp;
    server {
        listen 80 default_server;
        server_name @DOMAIN@;
        location ^~ /.well-known/acme-challenge/ {
            root C:/ETFQuantLab/data/acme-webroot;
            default_type text/plain;
            try_files $uri =404;
        }
        # 证书签发前只开放域名校验，不发送登录页或接收密码。
        location / { return 503; }
    }
}
